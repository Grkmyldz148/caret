<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Caret">
  <title>Caret</title>
  <!--
    Filled brand-accent tile with a white chevron + base line glyph.
    The previous outline-only mark vanished at 16×16 tab size against
    both light and dark Chrome chrome — too thin to read. A filled
    square renders as a recognisable coloured chip in any tab strip
    regardless of the user's OS theme, so the inline @media
    prefers-color-scheme override that the outline version needed
    is no longer required.
  -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#5882f7"/>
  <path
    d="M14 36 L32 18 L50 36"
    fill="none"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linejoin="miter"
    stroke-miterlimit="3"
    stroke-linecap="square"
  />
  <path
    d="M14 50 L50 50"
    fill="none"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linecap="square"
  />
</svg>
